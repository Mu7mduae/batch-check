<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KUBBAR Picking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first stack of screens — setup, invoices, invoice, line — plus a full-screen camera layer. */
:root{
  --bg:#f3f6f7; --panel:#ffffff; --fg:#13232b; --muted:#5a6b73; --line:#d6e0e4;
  --accent:#0b6e8a; --accent-fg:#ffffff;
  --ok:#17803d; --ok-bg:#e3f4e8; --warn:#9a6400; --warn-bg:#fbf0d9; --bad:#b42318; --bad-bg:#fde7e5;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171b; --panel:#15222a; --fg:#e4eef2; --muted:#93a7b0; --line:#26363f; --accent:#3fb3d4; --accent-fg:#06151b;
  --ok:#5fd38a; --ok-bg:#12301f; --warn:#f0b549; --warn-bg:#33270e; --bad:#ff8a80; --bad-bg:#3a1714; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e171b; --panel:#15222a; --fg:#e4eef2; --muted:#93a7b0; --line:#26363f; --accent:#3fb3d4; --accent-fg:#06151b;
  --ok:#5fd38a; --ok-bg:#12301f; --warn:#f0b549; --warn-bg:#33270e; --bad:#ff8a80; --bad-bg:#3a1714; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
img{max-width:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top h1{font-size:1.05rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{font:inherit;font-size:1.3rem;line-height:1;border:0;background:none;color:var(--accent);padding:4px 8px;cursor:pointer}
.wrap{max-width:600px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.card.head{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.card.head .muted{color:var(--accent-fg);opacity:.85}
.card.head .bar{background:rgba(255,255,255,.3)} .card.head .bar i{background:var(--accent-fg)}
.card.head .chip{background:var(--accent-fg);color:var(--accent)}
.part .x{font:inherit;font-size:.85rem;border:0;background:none;color:var(--bad);cursor:pointer;padding:4px}
.part.extra{border-style:dashed}
.take{font-size:.85rem;font-weight:700;color:var(--accent)}
.take b{font-size:1.15rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
button.card{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.row>*{min-width:0}
.muted{color:var(--muted);font-size:.88rem}
.mono{font-family:var(--mono)}
.big{font-size:1.05rem;font-weight:700}
.chip{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.OPEN{background:var(--line);color:var(--muted)} .chip.IN_PROGRESS{background:var(--warn-bg);color:var(--warn)}
.chip.WAITING_APPROVAL{background:var(--warn-bg);color:var(--warn)} .chip.ERROR{background:var(--bad-bg);color:var(--bad)}
.chip.DONE,.chip.PASS{background:var(--ok-bg);color:var(--ok)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden} .bar i{display:block;height:100%;background:var(--ok)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--accent);color:var(--accent-fg);width:100%;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
label{font-weight:500;font-size:.9rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;align-items:end}
.grid3 label{display:flex;flex-direction:column;gap:2px;justify-content:flex-end;height:100%}
.grid3 label .muted{font-size:.75rem;font-weight:400}
.state{font-weight:700;text-align:center;padding:14px;border-radius:12px}
.state.ok{background:var(--ok-bg);color:var(--ok)} .state.bad{background:var(--bad-bg);color:var(--bad)} .state.warn{background:var(--warn-bg);color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0} .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.thumb{max-height:180px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:500;text-align:center}
details summary{cursor:pointer;color:var(--muted);font-size:.88rem}
pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:.75rem;background:var(--bg);padding:8px;border-radius:8px;max-height:200px;overflow:auto}
/* full-screen camera: always over dark video, so fixed light-on-dark colours */
.cam{position:fixed;inset:0;z-index:100;background:#000}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .guide{position:absolute;left:7%;width:86%;top:35%;height:26%;border:4px solid #ff5a4f;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);transition:border-color .15s}
.cam .guide.mid{border-color:#f0b549} .cam .guide.ok{border-color:#35d07f}
.cam .hint{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 20px);text-align:center;color:#fff;font-weight:700;font-size:1.15rem;text-shadow:0 1px 4px #000}
.cam .target{position:absolute;left:16px;right:16px;top:calc(35% - 40px);text-align:center;color:#e6f2f5;font-family:var(--mono);font-size:.95rem;text-shadow:0 1px 3px #000}
.cam .meter{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);text-align:center;color:#b8c6cc;font-size:.7rem;font-family:var(--mono)}
.cam .actions{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;gap:10px}
.cam .actions button{flex:1;font:inherit;font-weight:700;border-radius:12px;padding:14px;border:0;background:rgba(255,255,255,.92);color:#0b2a33;cursor:pointer}
.cam .actions button.cancel{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.5)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<!-- Setup -->
<section id="scrSetup" hidden>
  <div class="top"><h1>KUBBAR Picking — setup</h1></div>
  <div class="wrap">
    <div class="card">
      <label for="cfgApi">Connection link (from the office)</label><input id="cfgApi" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
      <label for="cfgPin">PIN</label><input id="cfgPin" type="password" inputmode="numeric" autocomplete="off">
      <label for="cfgName">Your name</label><input id="cfgName" type="text" autocomplete="name" placeholder="e.g. Ashraf">
      <button class="btn" id="cfgSave" type="button">Save and open invoices</button>
      <div class="muted" id="cfgMsg"></div>
    </div>
  </div>
</section>

<!-- Invoices -->
<section id="scrList" hidden>
  <div class="top"><h1>Invoices to pick</h1><button class="back" id="btnOffice" type="button" aria-label="Office view" title="Office view">📋</button><button class="back" id="btnRefresh" type="button" aria-label="Refresh">↻</button><button class="back" id="btnSetup" type="button" aria-label="Settings">⚙</button></div>
  <div class="wrap">
    <div class="muted" id="engine">Loading the label reader…</div>
    <div id="invList" class="wrap" style="padding:0"></div>
  </div>
</section>

<!-- Office view -->
<section id="scrOffice" hidden>
  <div class="top"><button class="back" id="offBack" type="button" aria-label="Back to invoices">‹</button><h1>Office view</h1><button class="back" id="offRefresh" type="button" aria-label="Refresh">↻</button></div>
  <div class="wrap">
    <div class="card" id="offPinBox" hidden>
      <label for="offPin">Office PIN</label><input id="offPin" type="password" inputmode="numeric" autocomplete="off">
      <button class="btn" id="offGo" type="button">Open office view</button>
    </div>
    <div class="state" id="offSummary" hidden></div>
    <div id="offList" class="wrap" style="padding:0"></div>
  </div>
</section>

<!-- One invoice -->
<section id="scrInv" hidden>
  <div class="top"><button class="back" id="invBack" type="button" aria-label="Back to invoices">‹</button><h1 id="invTitle"></h1></div>
  <div class="wrap">
    <div class="card head"><div class="row"><span class="big" id="invCustomer"></span><span class="chip" id="invChip"></span></div><div class="muted" id="invMeta"></div><div class="bar"><i id="invBar"></i></div></div>
    <div id="lineList" class="wrap" style="padding:0"></div>
    <div class="state" id="invState"></div>
  </div>
</section>

<!-- One line -->
<section id="scrLine" hidden>
  <div class="top"><button class="back" id="lineBack" type="button" aria-label="Back to invoice">‹</button><h1 id="lineTitle"></h1></div>
  <div class="wrap">
    <div class="card">
      <div class="big" id="lineProduct"></div>
      <dl class="kv"><dt>Batch</dt><dd class="mono" id="lineBatch"></dd><dt>Expiry</dt><dd class="mono" id="lineExp"></dd><dt>Quantity</dt><dd id="lineQty"></dd></dl>
    </div>

    <div id="parts" class="wrap" style="padding:0"></div>

    <div class="state" id="qtyState"></div>
    <div class="card" id="extraBox" hidden>
      <span class="big">Not enough in this batch?</span>
      <span class="muted">Complete the missing quantity from another batch. A second batch needs office approval before the invoice counts as done.</span>
      <label for="extraSel">Batch to complete from</label>
      <select id="extraSel"></select>
      <button class="btn ghost" id="extraAdd" type="button">+ Complete from this batch</button>
    </div>
    <div class="state warn" id="changeNote" hidden></div>

    <button class="btn" id="btnSave" type="button" disabled>Save line</button>
  </div>
</section>

<!-- Full-screen camera -->
<div class="cam" id="cam" hidden>
  <video id="vid" playsinline muted autoplay></video>
  <div class="guide" id="guide"></div>
  <div class="hint" id="hint">Fit the batch and expiry inside the box</div>
  <div class="target" id="camTarget"></div>
  <div class="meter" id="meter"></div>
  <div class="actions"><button class="cancel" id="camCancel" type="button">Cancel</button><button id="camSnap" type="button">Capture now</button></div>
</div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<div class="toast" id="toast" hidden></div>
<div id="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/iife/reader/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.wasm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
let KNOWN=[]; // batches of the current product: an exact hit on one that is not the target means a different batch
// ---------- matching ----------
const MAP={O:"0",Q:"0",I:"1",L:"1","|":"1",S:"5",B:"8",Z:"2",G:"6"};
function norm(s){return (s||"").toUpperCase().replace(/[OQIL|SBZG]/g,c=>MAP[c]).replace(/[^A-Z0-9]/g,"")}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function findBatch(text,batch){
 const T=norm(text),B=norm(batch);
 if(!B) return {r:"none"};
 if(T.includes(B)) return {r:"ok"};
 const other=KNOWN.find(k=>norm(k)!==B&&T.includes(norm(k)));
 if(other) return {r:"other",got:other};
 const tol=B.length>=8?2:B.length>=6?1:0; let best=null;
 if(tol){for(let i=0;i+B.length<=T.length;i++){const w=T.substr(i,B.length);const d=lev(w,B);if(d<=tol&&(!best||d<best.d))best={d,w}}}
 if(best) return {r:"near",got:best.w};
 return {r:"bad"};
}
function findExp(text,[m,y]){
 const T=norm(text),mm=String(m).padStart(2,"0"),yy=String(y).slice(2);
 const c=[MON[m-1]+y, MON[m-1]+yy, mm+y, y+mm].map(norm);
 if(c.some(x=>T.includes(x))) return "ok";
 // short date written YY.MM.DD / YYMMDD where the reader dropped the century or the dots: a 6–8 digit run with YYMM inside
 const runs=(text||"").toUpperCase().replace(/[OQ]/g,"0").replace(/[.\-\/ ]/g,"").match(/\d{6,8}/g)||[];
 return runs.some(r=>r.includes(yy+mm))?"ok":"bad";
}
// GS1 element strings: expiry AI (17)YYMMDD
function gs1Exp(raw){const s=raw.replace(/[()]/g,"");const k=s.search(/17(\d{6})/);if(k<0)return null;const d=s.substr(k+2,6);return [+d.substr(2,2),2000+ +d.substr(0,2)]}


// ---------- engines ----------
let ocr=null, detector=null, ocrReady=false, engineName="";
// PaddleOCR (PP-OCRv4): a detection model finds text lines, a recognition model reads each line. Runs on the phone via ONNX Runtime.
const P={det:null,rec:null,keys:null};
async function initPaddle(){
 if(!window.ort) throw new Error("ONNX runtime did not load");
 ort.env.wasm.numThreads=1; ort.env.wasm.proxy=false; ort.env.wasm.wasmPaths=new URL("./",document.baseURI).href;
 const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u+" HTTP "+r.status);return new Uint8Array(await r.arrayBuffer())};
 $("engine").textContent="Downloading the text reader (about 27 MB)…";
 const [d,r,k]=await Promise.all([get("det.wasm"),get("rec.wasm"),fetch("keys.txt").then(x=>x.text())]);
 $("engine").textContent="Starting the text reader…";
 P.det=await ort.InferenceSession.create(d,{executionProviders:["wasm"]});
 P.rec=await ort.InferenceSession.create(r,{executionProviders:["wasm"]});
 P.keys=k.split(/\r?\n/); if(P.keys[P.keys.length-1]==="")P.keys.pop(); P.keys.push(" ");
}
(async()=>{
 try{ if("BarcodeDetector" in window){const f=await BarcodeDetector.getSupportedFormats();const want=["data_matrix","code_128","qr_code","ean_13","gs1_databar","itf"].filter(x=>f.includes(x));if(want.length)detector=new BarcodeDetector({formats:want})} }catch(e){}
 try{ await initPaddle(); ocrReady=true; engineName="paddle";
  $("engine").textContent="Ready ✓ — barcode reader + PaddleOCR (+ Tesseract as a third opinion when needed)"; return;
 }catch(e){ $("engine").textContent="PaddleOCR failed ("+(e&&e.message||e)+"), using the basic reader…"; }
 if(await initTesseract()){ocrReady=true;engineName="tesseract";$("engine").textContent="Ready ✓ — basic text reader + barcode reader"}
})();
// Tesseract: loaded only when a third opinion is needed (or PaddleOCR failed).
let tessP=null;
function initTesseract(){ if(tessP) return tessP; return tessP=(async()=>{ try{
  // Check the language file is reachable, then give the reader a worker that serves it from this page's own files.
  const LANG=new URL("eng-traineddata.wasm",document.baseURI).href;
  let resp; try{resp=await fetch(LANG,{method:"GET"})}catch(e){throw new Error("language file did not download ("+(e&&e.message||e)+")")}
  if(!resp.ok) throw new Error("language file HTTP "+resp.status);
  const shim="const L="+JSON.stringify(LANG)+";const F=self.fetch.bind(self);self.fetch=(u,o)=>String(u).endsWith('eng.traineddata.gz')?F(L):F(u,o);importScripts('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js');";
  const workerURL=URL.createObjectURL(new Blob([shim],{type:"application/javascript"}));
  ocr=await Tesseract.createWorker("eng",1,{workerPath:workerURL,workerBlobURL:false,corePath:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/",langPath:"https://lang.local/eng",cacheMethod:"none"});
  return true;
 }catch(e){ $("status").textContent="Tesseract did not start: "+(e&&e.message||e); return false; } })(); }

// Barcode reader: zxing-cpp (WebAssembly). Finds small, tilted DataMatrix / Code 128 anywhere in the photo.
let zxReady=null;
function initZX(){
 if(zxReady) return zxReady;
 if(!window.ZXingWASM) return zxReady=Promise.resolve(false);
 const wasm=new URL("zxing_reader.wasm",document.baseURI).href;
 ZXingWASM.prepareZXingModule({overrides:{locateFile:(p,pre)=>p.endsWith(".wasm")?wasm:pre+p},fireImmediately:true});
 return zxReady=Promise.resolve(true);
}
async function scanBarcodes(img){
 if(!(await initZX())) return null;
 if(img instanceof HTMLCanvasElement){const res=await ZXingWASM.readBarcodes(img.getContext("2d").getImageData(0,0,img.width,img.height),{formats:["DataMatrix","Code128","QRCode","EAN-13"],tryHarder:true,tryRotate:true,maxNumberOfSymbols:4});const t=res.filter(r=>r.isValid&&r.text).map(r=>r.text);return t.length?t.join(" | "):null}
 const found=[];
 for(const max of [3000,1600]){
  const c=toCanvas(img,max,"none"); const data=c.getContext("2d").getImageData(0,0,c.width,c.height);
  const res=await ZXingWASM.readBarcodes(data,{formats:["DataMatrix","Code128","QRCode","EAN-13"],tryHarder:true,tryRotate:true,tryDownscale:true,maxNumberOfSymbols:4});
  res.filter(r=>r.isValid&&r.text).forEach(r=>{if(!found.includes(r.text))found.push(r.text)});
  if(found.some(t=>/\((01|02|10|17)\)/.test(t))) break;
 }
 return found.length?found.join(" | "):null;
}
function toCanvas(img,max,f){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);const x=c.getContext("2d");x.filter=f||"grayscale(1) contrast(1.35)";x.drawImage(img,0,0,c.width,c.height);return c}


// ---------- image preparation ----------
// Draw a region of the photo, scaled, with an optional treatment:
//  "gray"  grayscale + contrast            "otsu"  black/white at the best threshold
//  "dots"  blur then black/white then thicken dark strokes — joins dot-matrix (inkjet) print into solid letters
//  "inv"   same as otsu but inverted (light print on dark background)
function prep(img,[sx,sy,sw,sh],scale,mode){
 const c=document.createElement("canvas");c.width=Math.max(1,Math.round(sw*scale));c.height=Math.max(1,Math.round(sh*scale));
 const g=c.getContext("2d",{willReadFrequently:true});
 const blur=mode==="dots"?Math.max(1,Math.round(scale*1.2)):0;
 g.filter="grayscale(1) contrast(1.35)"+(blur?" blur("+blur+"px)":"");
 g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
 if(mode==="gray") return c;
 const d=g.getImageData(0,0,c.width,c.height),p=d.data,n=c.width*c.height,v=new Uint8Array(n),hist=new Array(256).fill(0);
 for(let i=0;i<n;i++){v[i]=p[i*4];hist[v[i]]++}
 let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sB=0,wB=0,best=0,th=128;
 for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sum-sB)/wF,b=wB*wF*(mB-mF)*(mB-mF);if(b>best){best=b;th=t}}
 let dark=new Uint8Array(n);for(let i=0;i<n;i++)dark[i]=(v[i]<=th)!==(mode==="inv")?1:0;
 if(mode==="dots"){const W=c.width,H=c.height,o=new Uint8Array(n);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let k=0;for(let dy=-1;dy<=1&&!k;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<H&&xx>=0&&xx<W&&dark[yy*W+xx]){k=1;break}}o[y*W+x]=k}dark=o}
 for(let i=0;i<n;i++){const val=dark[i]?0:255;p[i*4]=p[i*4+1]=p[i*4+2]=val;p[i*4+3]=255}
 g.putImageData(d,0,0);return c;
}
// Photo quality: sharpness (variance of the Laplacian) and glare (share of blown-out pixels).
function quality(img){
 const s=Math.min(1,800/Math.max(img.naturalWidth,img.naturalHeight)),W=Math.round(img.naturalWidth*s),H=Math.round(img.naturalHeight*s);
 const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d",{willReadFrequently:true});g.filter="grayscale(1)";g.drawImage(img,0,0,W,H);
 const p=g.getImageData(0,0,W,H).data;let m=0,m2=0,k=0,hot=0;
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=(y*W+x)*4,L=4*p[i]-p[i-4]-p[i+4]-p[i-W*4]-p[i+W*4];m+=L;m2+=L*L;k++;if(p[i]>=250)hot++}
 m/=k;return {sharp:Math.round(m2/k-m*m),glare:hot/k};
}
// Characters the reader may output for this line: the batch's own characters, digits, and what dates use.
function whitelistFor(l){const s=new Set((l.batch+"0123456789"+MON[l.exp[0]-1]+"-./ ").toUpperCase());return [...s].join("")}
async function ocrRun(canvas,psm,wl){
 await ocr.setParameters({tessedit_pageseg_mode:String(psm),tessedit_char_whitelist:wl||""});
 const r=await ocr.recognize(canvas,{},{text:true,blocks:true});
 return r.data;
}
function linesOf(data){const out=[];(data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(L=>out.push(L))));return out}
// Closeness of a piece of text to the batch: 0 = contains it exactly.
function closeness(text,batch){const T=norm(text),B=norm(batch);if(T.includes(B))return 0;let best=B.length;for(let i=0;i<=Math.max(0,T.length-B.length);i++)best=Math.min(best,lev(T.substr(i,B.length),B));return best}

// Read the printed text: whole photo first to find the text lines, then each promising line again, enlarged,
// in several treatments, with only the expected characters allowed. Stops as soon as the batch is found.
async function readText(img,l,region){
 const W=img.naturalWidth,H=img.naturalHeight,wl=whitelistFor(l);let all="",passes=0;
 const done=()=>{const r=findBatch(all,l.batch).r;return (r==="ok"||r==="other")&&findExp(all,l.exp)==="ok"};
 const say=t=>$("status").textContent=t;
 let cands=[];
 if(region){ cands=[{box:region,h:region[3]/2}]; }
 else{
  const sc=Math.min(1,1600/Math.max(W,H));
  for(const mode of ["gray","dots"]){
   passes++;say("Reading printed text… (pass "+passes+")");
   const d=await ocrRun(prep(img,[0,0,W,H],sc,mode),11,"");all+="\n"+(d.text||"");
   linesOf(d).forEach(L=>{const b=L.bbox;cands.push({box:[b.x0/sc,b.y0/sc,(b.x1-b.x0)/sc,(b.y1-b.y0)/sc],h:(b.y1-b.y0)/sc,t:L.text})});
   if(done())return {text:all,passes};
  }
  // keep only lines that already look a bit like the batch; at most 4, so a photo without the batch fails fast
  const lim=Math.ceil(norm(l.batch).length/2);
  cands=cands.filter(c=>/[0-9]/.test(c.t||"")&&c.box[2]>8&&c.box[3]>4).map(c=>({...c,d:closeness(c.t,l.batch)}))
   .filter(c=>c.d<=lim).sort((a,b)=>a.d-b.d).slice(0,4);
 }
 for(const c of cands){
  const [x,y,w,h]=c.box,pad=Math.max(6,h*0.6),bx=[Math.max(0,x-pad),Math.max(0,y-pad),Math.min(W,x+w+pad)-Math.max(0,x-pad),Math.min(H,y+h+pad)-Math.max(0,y-pad)];
  const scale=Math.max(1,Math.min(5,48/Math.max(4,c.h)));
  for(const mode of ["gray","dots","otsu","inv"]){
   passes++;say("Reading the batch line… (pass "+passes+")");
   const d=await ocrRun(prep(img,bx,scale,mode),region?6:7,wl);all+="\n"+(d.text||"");
   if(done())return {text:all,passes};
   if(findBatch(all,l.batch).r==="ok"&&mode!=="gray")break;
  }
 }
 return {text:all,passes};
}

// ---------- PaddleOCR ----------
// Find text lines in a region of the photo. Returns boxes [x,y,w,h] in photo pixels.
async function pDetect(img,[sx,sy,sw,sh],maxSide){
 const s=Math.min(1,maxSide/Math.max(sw,sh)),W=Math.max(32,Math.round(sw*s/32)*32),H=Math.max(32,Math.round(sh*s/32)*32);
 const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(img,sx,sy,sw,sh,0,0,W,H);
 const p=g.getImageData(0,0,W,H).data,n=W*H,f=new Float32Array(3*n);
 for(let i=0;i<n;i++){f[i]=(p[i*4]/255-0.485)/0.229;f[n+i]=(p[i*4+1]/255-0.456)/0.224;f[2*n+i]=(p[i*4+2]/255-0.406)/0.225}
 const o=await P.det.run({[P.det.inputNames[0]]:new ort.Tensor("float32",f,[1,3,H,W])});const prob=o[P.det.outputNames[0]].data;
 // threshold, thicken by one pixel (joins dot-matrix print), then connected regions
 const bin=new Uint8Array(n);for(let i=0;i<n;i++)if(prob[i]>0.3){bin[i]=1}
 const dil=new Uint8Array(n);for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(bin[y*W+x]){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<H&&xx>=0&&xx<W)dil[yy*W+xx]=1}}}
 const lab=new Int32Array(n),boxes=[],q=new Int32Array(n);let id=0;
 for(let i=0;i<n;i++){if(!dil[i]||lab[i])continue;id++;let h=0,t=0;q[t++]=i;lab[i]=id;let x0=W,y0=H,x1=0,y1=0,cnt=0,sp=0;
  while(h<t){const j=q[h++],x=j%W,y=(j/W)|0;cnt++;sp+=prob[j];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
   if(x>0&&dil[j-1]&&!lab[j-1]){lab[j-1]=id;q[t++]=j-1}if(x<W-1&&dil[j+1]&&!lab[j+1]){lab[j+1]=id;q[t++]=j+1}
   if(y>0&&dil[j-W]&&!lab[j-W]){lab[j-W]=id;q[t++]=j-W}if(y<H-1&&dil[j+W]&&!lab[j+W]){lab[j+W]=id;q[t++]=j+W}}
  if(cnt<10||sp/cnt<0.45)continue;
  const w=x1-x0+1,hh=y1-y0+1,d=(w*hh*1.5)/(2*(w+hh));
  const kx=sw/W,ky=sh/H;const bx=Math.max(0,sx+(x0-d)*kx),by=Math.max(0,sy+(y0-d)*ky);
  boxes.push([bx,by,Math.min(img.naturalWidth-bx,(w+2*d)*kx),Math.min(img.naturalHeight-by,(hh+2*d)*ky)]);
 }
 return boxes.sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
}
// Read one line. mode: null = photo as is, or a prep() treatment.
async function pRecognize(img,box,mode){
 let [x,y,w,h]=box;let src;
 if(mode){src=prep(img,box,Math.max(1,Math.min(4,96/Math.max(4,h))),mode);x=0;y=0;w=src.width;h=src.height}else src=img;
 const vertical=h>w*1.5;const lw=vertical?h:w,lh=vertical?w:h;
 const H=48,W=Math.max(16,Math.min(1280,Math.ceil(H*lw/Math.max(1,lh))));
 const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d",{willReadFrequently:true});
 if(vertical){g.translate(0,H);g.rotate(-Math.PI/2);g.drawImage(src,x,y,w,h,0,0,H,W)}else g.drawImage(src,x,y,w,h,0,0,W,H);
 const p=g.getImageData(0,0,W,H).data,n=W*H,f=new Float32Array(3*n);
 for(let i=0;i<n;i++){f[i]=p[i*4]/127.5-1;f[n+i]=p[i*4+1]/127.5-1;f[2*n+i]=p[i*4+2]/127.5-1}
 const o=await P.rec.run({[P.rec.inputNames[0]]:new ort.Tensor("float32",f,[1,3,H,W])});const t=o[P.rec.outputNames[0]];
 const [,T,C]=t.dims,d=t.data;let out="",prev=0;
 for(let i=0;i<T;i++){let bi=0,bv=-1;for(let k=0;k<C;k++){const v=d[i*C+k];if(v>bv){bv=v;bi=k}}if(bi!==0&&bi!==prev)out+=P.keys[bi-1]||"";prev=bi}
 return out;
}
async function readTextPaddle(img,l,region){
 const W=img.naturalWidth,H=img.naturalHeight;let all="",passes=0;
 const done=()=>{const r=findBatch(all,l.batch).r;return (r==="ok"||r==="other")&&findExp(all,l.exp)==="ok"};
 const say=t=>$("status").textContent=t;
 say("Finding text lines…");
 const reg=region||[0,0,W,H];
 let boxes=await pDetect(img,reg,region?960:1280);
 if(!boxes.length&&region)boxes=[reg];
 boxes=boxes.filter(b=>b[2]>6&&b[3]>6).slice(0,60);
 const read=[];
 for(const b of boxes){passes++;if(passes%5===0)say("Reading line "+passes+" of "+boxes.length+"…");
  const t=await pRecognize(img,b,null);read.push({b,t});all+="\n"+t;if(done())return {text:all,passes};}
 // batch not exact yet: read the lines that look closest again with stronger treatments
 const lim=Math.ceil(norm(l.batch).length/2);
 const cands=read.map(r=>({...r,d:closeness(r.t,l.batch)})).filter(r=>r.d<=lim).sort((a,b)=>a.d-b.d).slice(0,4);
 for(const c of cands)for(const mode of ["dots","otsu","gray"]){passes++;say("Reading the batch line again… ("+mode+")");
  const t=await pRecognize(img,c.b,mode);all+="\n"+t;if(done()||findBatch(all,l.batch).r==="ok")break;}
 return {text:all,passes};
}

const store={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function show(id){["scrSetup","scrList","scrInv","scrLine","scrOffice"].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function expArr(s){const m=String(s).match(/(\d{1,2})\D+(\d{4})/);return m?[+m[1],+m[2]]:[0,0]}
function expTxt(s){const a=expArr(s);return a[0]?MON[a[0]-1]+" "+a[1]:String(s)}
function split(q,levels){let r=q;const parts=[];levels.forEach((lv,i)=>{const n=i===levels.length-1?r:Math.floor(r/lv.factor);r-=n*lv.factor;if(n)parts.push(n+" "+lv.name)});return parts.join(" · ")||"0 "+levels[levels.length-1].name}
const STATUS_TXT={OPEN:"Not started",IN_PROGRESS:"In progress",WAITING_APPROVAL:"Waiting approval",DONE:"Done ✓",PASS:"Done ✓",ERROR:"Error"};

async function api(action,body,pinOverride){
 if(!cfg.api) throw new Error("no connection link");
 const pin=pinOverride||cfg.pin;let r;
 if(body) r=await fetch(cfg.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({},body,{action,pin}))});
 else r=await fetch(cfg.api+(cfg.api.includes("?")?"&":"?")+"action="+action+"&pin="+encodeURIComponent(pin));
 const j=await r.json(); if(!j.ok) throw new Error(j.error==="wrong_pin"?"Wrong PIN":j.error); return j;
}

// A line is picked as one or more "parts": the invoice batch first, and only if it is short, extra batches
// chosen from the batches that the stock report shows in stock for this product.
let parts=[],pick=null; // pick = the part being scanned
function needSplit(q,levels){let rem=q;return levels.map((lv,i)=>{const n=i===levels.length-1?rem:Math.floor(rem/lv.factor);rem-=n*lv.factor;return n})}

function addPart(b,takeQty){

 c.innerHTML='<div class="row"><span class="big"></span><span class="chip OPEN">Not checked</span></div>'+
  '<div class="muted"></div>'+
  '<button class="btn scan" type="button">📷 Scan label</button>'+
  '<img class="thumb" alt="Label photo" hidden><div class="muted st"></div>'+
  '<dl class="kv res" hidden><dt>Batch</dt><dd class="rb"></dd><dt>Expiry</dt><dd class="re"></dd><dt>Read by</dt><dd class="rs"></dd></dl>'+
  '<details class="raw" hidden><summary>What the camera read</summary><pre></pre></details>'+

  raw:c.querySelector(".raw"),typed:c.querySelector(".typed"),warn:c.querySelector(".warnq"),inputs:[]};

 c.querySelector(".tg").onclick=()=>{const t=norm(c.querySelector(".typed input").value),B=norm(p.batch);if(t.length<4)return;
  p.tried=true;p.verified=B.endsWith(t);p.readFrom=p.verified?"typed":"";if(!p.verified)toast("That is not batch "+p.batch+" — check the box");partChip(p);refreshLine()};

 l.levels.forEach((lv,i)=>{const lab=document.createElement("label");lab.textContent=lv.name;

function partQty(p){return curLine.levels.reduce((s,lv,i)=>s+(Number(p.el.inputs[i].value)||0)*lv.factor,0)}

function refreshLine(){
 const l=curLine,q=l.qty,unit=l.levels[l.levels.length-1].name,s=$("qtyState");let t=0,problem="";
 parts.forEach(p=>{const n=partQty(p);t+=n;p.el.warn.textContent="";
  if(n>p.avail){p.el.warn.textContent="⚠ "+n+" is more than the stock report shows for this batch ("+p.avail+")";problem=problem||"over stock"}
  if(n>0&&!p.verified)problem=problem||"check";});
 if(!t){s.className="state";s.textContent="Invoice needs "+split(q,l.levels)}
 else if(t===q){s.className="state ok";s.textContent="✓ "+t+" of "+q+" "+unit+(parts.filter(p=>partQty(p)>0).length>1?" from "+parts.filter(p=>partQty(p)>0).length+" batches":"")}
 else{s.className="state bad";s.textContent=(t<q?"Short ":"Over ")+Math.abs(q-t)+" "+unit+" — picked "+t+" of "+q}
 // "complete from another batch" only when short after something was taken, and only batches not already used
 const used=parts.map(p=>p.batch),free=l.otherBatches.filter(b=>!used.includes(b.batch));
 // last option: after taking from the invoice batch and still short, or when the stock report already shows it short
 $("extraBox").hidden=!(t<q&&free.length&&(t>0||parts[0].avail<q));
 const sel=$("extraSel"),keep=sel.value;sel.innerHTML="";free.forEach(b=>{const o=document.createElement("option");o.value=b.batch;o.textContent=b.batch+" · exp "+expTxt(b.exp)+" · stock "+b.qty;sel.appendChild(o)});if(free.some(b=>b.batch===keep))sel.value=keep;
 const extra=parts.some(p=>!p.isInv&&partQty(p)>0);
 $("changeNote").hidden=!extra;$("changeNote").textContent="Includes another batch — the office must approve before the invoice is done";
 const ok=t===q&&!problem;$("btnSave").disabled=!ok;
 $("btnSave").textContent=problem==="check"?"Confirm every batch first":problem==="over stock"?"More than the batch stock":t!==q?"Quantity must match the invoice":"Save line";
}
$("extraAdd").onclick=()=>{const b=curLine.otherBatches.find(x=>x.batch===$("extraSel").value);if(!b)return;
 const t=parts.reduce((s,p)=>s+partQty(p),0);const p=addPart({batch:b.batch,exp:b.exp,avail:b.qty,isInv:false},Math.max(0,curLine.qty-t));
 refreshLine();p.el.card.scrollIntoView({behavior:"smooth",block:"start"})};
$("btnSave").onclick=async()=>{
 const btn=$("btnSave");btn.disabled=true;btn.textContent="Saving…";
 const payload=parts.filter(p=>partQty(p)>0).map(p=>({batch:p.batch,qty:partQty(p),as:partAs(p),readFrom:p.readFrom,expiry:p.expOk?"read OK":"not read",verified:p.verified}));
 try{const r=await api("pick",{invoice:curInv.invoice,line:curLine.line,parts:payload,picker:cfg.picker});
  toast(r.saved.status==="PASS"?"Line saved ✓":r.saved.status==="WAITING_APPROVAL"?"Saved — waiting for office approval":"Not accepted: "+(r.saved.problems||[]).join("; "));
  await loadInvoices("scrInv");if(r.saved.status==="ERROR")openLine(curInv.lines.find(x=>x.line===curLine.line)||curLine);else show("scrInv");
 }catch(e){toast("Not saved: "+e.message);refreshLine()}
};

// ---- reading a label: every reader gives evidence, one decision ----
async function verify(img,region){
 const tgt={batch:pick.target,exp:expArr(pick.exp)};const ev=[];let raw="";
 const add=(name,txt,gs)=>{const ex=gs?(gs[0]===tgt.exp[0]&&gs[1]===tgt.exp[1]?"ok":"bad"):findExp(txt,tgt.exp);ev.push({name,b:findBatch(txt,tgt.batch),ex});raw+="["+name+"] "+(txt.trim()||"(nothing)")+"\n\n"};
 const st=t=>pick.el.st.textContent=t;
 st("Reading the barcode…");
 let code=null;try{code=await scanBarcodes(img)}catch(e){}
 if(code)add("Barcode",code,gs1Exp(code));
 if(engineName==="paddle"){st("Reading the printed text…");try{add("PaddleOCR",(await readTextPaddle(img,tgt,region)).text)}catch(e){}}
 const okN=ev.filter(e=>e.b.r==="ok").length,otherN=ev.filter(e=>e.b.r==="other").length;
 if((okN===0&&otherN===0)||(okN&&otherN)){st("Asking a third reader…");if(await initTesseract()){try{add("Tesseract",(await readText(img,tgt,region)).text)}catch(e){}}}
 const other=ev.find(e=>e.b.r==="other"),ok=ev.find(e=>e.b.r==="ok"),near=ev.find(e=>e.b.r==="near");
 return {b:other?other.b:ok?{r:"ok"}:near?near.b:{r:"bad"},ex:ev.some(e=>e.ex==="ok")?"ok":"bad",src:ev.map(e=>e.name+" "+(e.b.r==="ok"?"✓":e.b.r==="other"?"✗":"–")).join(" · ")||"nothing",raw};
}
async function checkPhoto(blob,region){
 const p=pick,e=p.el,img=e.img;img.src=URL.createObjectURL(blob);img.hidden=false;await new Promise(r=>{if(img.complete&&img.naturalWidth)r();else{img.onload=r;img.onerror=r}});
 const res=await verify(img,region);p.tried=true;
 p.verified=res.b.r==="ok";p.expOk=res.ex==="ok";p.readFrom=res.src;
 e.st.textContent="";e.res.hidden=false;e.raw.hidden=false;e.raw.querySelector("pre").textContent=res.raw;
 e.rb.textContent=res.b.r==="ok"?"✓ "+p.batch:res.b.r==="other"?"✗ Box says "+res.b.got+" — this part needs batch "+p.batch:res.b.r==="near"?"⚠ Read "+res.b.got+" — close, scan again or type it":"✗ Not found — scan closer, or type it";
 e.re.textContent=p.expOk?"✓ "+expTxt(p.exp):"Not read (expected "+expTxt(p.exp)+")";
 e.rs.textContent=res.src;e.typed.hidden=p.verified||res.b.r==="other";
 // a wrong batch in hand is recorded for the office, even if the picker corrects it afterwards
 if(res.b.r==="other")api("attempt",{invoice:curInv.invoice,line:curLine.line,code:curLine.code,expected:p.batch,read:res.b.got,readFrom:res.src,picker:cfg.picker}).catch(()=>{});
 partChip(p);refreshLine();
}

// ---- full-screen camera with a guide box ----
let stream=null,loopT=null,greens=0,tickN=0;const vid=$("vid"),guide=$("guide");
async function startScan(p){
 pick=p;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false})}
 catch(e){$("fileCam").click();return} // no live camera: fall back to the phone's camera app
 $("camTarget").textContent="Batch "+pick.target+" · exp "+expTxt(pick.exp);
 $("cam").hidden=false;document.body.style.overflow="hidden";vid.srcObject=stream;try{await vid.play()}catch(e){}
 greens=0;tickN=0;guide.className="guide";tick();
};
$("fileCam").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)checkPhoto(f,null)};
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;clearTimeout(loopT);$("cam").hidden=true;document.body.style.overflow=""}
$("camCancel").onclick=stopCam;$("camSnap").onclick=()=>{if(stream)capture()};
// the guide box on screen, in video pixels (the video fills the screen with object-fit:cover)
function guideRect(){
 const vr=vid.getBoundingClientRect(),gr=guide.getBoundingClientRect(),vw=vid.videoWidth,vh=vid.videoHeight;
 const s=Math.max(vr.width/vw,vr.height/vh),ox=(vw*s-vr.width)/2,oy=(vh*s-vr.height)/2;
 const x=Math.max(0,(gr.left-vr.left+ox)/s),y=Math.max(0,(gr.top-vr.top+oy)/s);
 return [x,y,Math.min(vw-x,gr.width/s),Math.min(vh-y,gr.height/s)];
}
function frameStats(c){
 const W=c.width,H=c.height,p=c.getContext("2d",{willReadFrequently:true}).getImageData(0,0,W,H).data;let m=0,m2=0,k=0,edge=0,hot=0,lum=0;
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=(y*W+x)*4,g=p[i],L=4*g-p[i-4]-p[i+4]-p[i-W*4]-p[i+W*4];m+=L;m2+=L*L;k++;if(Math.abs(L)>40)edge++;if(g>=250)hot++;lum+=g}
 m/=k;return {sharp:m2/k-m*m,edge:edge/k,glare:hot/k,lum:lum/k};
}
async function tick(){
 if(!stream)return;if(!vid.videoWidth){loopT=setTimeout(tick,200);return}
 const [gx,gy,gw,gh]=guideRect(),s=Math.min(1,480/gw),c=document.createElement("canvas");c.width=Math.max(8,Math.round(gw*s));c.height=Math.max(8,Math.round(gh*s));
 const g=c.getContext("2d",{willReadFrequently:true});g.filter="grayscale(1)";g.drawImage(vid,gx,gy,gw,gh,0,0,c.width,c.height);const st=frameStats(c);
 let codeHit=false;
 if(++tickN%3===0&&window.ZXingWASM){try{const fc=document.createElement("canvas");fc.width=Math.round(gw);fc.height=Math.round(gh);fc.getContext("2d").drawImage(vid,gx,gy,gw,gh,0,0,fc.width,fc.height);const t=await scanBarcodes(fc);codeHit=!!t&&findBatch(t,pick.target).r==="ok"}catch(e){}}
 let level="bad",hint;
 if(st.lum<45)hint="More light, please";else if(st.glare>0.08)hint="Glare — tilt the box a little";else if(st.edge<0.035)hint="Move closer — fit the batch inside the box";
 else if(st.sharp<70)hint="Hold steady — the label is blurred";else if(st.sharp<150){level="mid";hint="Almost — hold steady"}else{level="ok";hint="Hold still…"}
 if(codeHit){level="ok";hint="Barcode found — hold still…"}
 guide.className="guide"+(level==="ok"?" ok":level==="mid"?" mid":"");$("hint").textContent=hint;
 $("meter").textContent="sharp "+Math.round(st.sharp)+" · text "+Math.round(st.edge*100)+"% · glare "+Math.round(st.glare*100)+"%";
 greens=level==="ok"?greens+1:0;if(greens>=3||codeHit){capture();return}
 loopT=setTimeout(tick,250);
}
async function capture(){
 const vw=vid.videoWidth,vh=vid.videoHeight,region=guideRect(),c=document.createElement("canvas");c.width=vw;c.height=vh;c.getContext("2d").drawImage(vid,0,0,vw,vh);
 stopCam();const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.95));await checkPhoto(blob,region);
}

// ---- start ----
if(cfg.api&&cfg.pin&&cfg.picker)loadInvoices();else openSetup();
</script>
